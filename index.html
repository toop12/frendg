<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello My Love - Surprise Gifts!</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card" id="page1">
        <img src="img/hello kitty pixel art.png" alt="Hello Kitty" class="character-img">
        
        <h1>HELLO MY LOVE!</h1>
        <p class="subtitle">Do you want to see your gift?</p>
        
        <div class="buttons-container">
            <button class="btn" id="yesBtn" onclick="goToPage2()">YES PLEASE</button>
            <button class="btn" id="noBtn" onclick="growYes()">NO THANKS</button>
        </div>
    </div>

    <div class="card" id="page2">
        <h1>SURPRISE GIFTS FOR YOU!</h1>
        <p class="subtitle">Tap to reveal your surprise gifts...</p>
        
        <div class="gifts-grid">
            <div class="gift-box" onclick="openGift(
                '💌 رسالة خاصة', 
                'أنتِ أجمل شيء حدث في حياتي، شكراً لأنكِ دائماً تجعلين يومي أفضل! 🌸', 
                null, 
                'img/Valentine Envelopes Clipart Vector, Pink Envelope Valentine Paper Cut, Pink, Envelope, Valentines Day PNG Image For Free Download.png'
            )">
                <span class="gift-title">Special Letter</span>
                <img src="img/Valentine Envelopes Clipart Vector, Pink Envelope Valentine Paper Cut, Pink, Envelope, Valentines Day PNG Image For Free Download.png" alt="Gift 1">
            </div>

            <!-- الكارت الثاني: أغنية فقط -->
<div class="gift-box" onclick="openGift(
    '🎧 قائمة أغاني', 
    'استمعي لهذه الأغنية الخاصة اللطيفة! 🎶✨', 
    'audio/Jungkook-_정국_-_Still-With-You_-Lyrics.mp3', 
    'img/تنزيل (34).png'
)">
    <span class="gift-title">music</span>
    <img src="img/تنزيل (34).png" alt="Gift 2">
</div>
            <div class="gift-box" onclick="openGift(
                '💐 مفاجأة وردية', 
                'باقة ورد وردية ولطيفة خصيصاً لأجمل شخص! 🎀', 
                null, 
                'img/تنزيل (35).png'
            )">
                <span class="gift-title">Sweet Surprise</span>
                <img src="img/تنزيل (35).png" alt="Gift 3">
            </div>
        </div>
    </div>

   <!-- النافذة المنبثقة للهدية -->
<div class="modal-overlay" id="giftModal">
    <div class="modal-content">
        <img id="modalFlower" class="modal-flower" src="" alt="Flower">
        
        <h3 id="modalTitle">عنوان الهدية</h3>
        <p id="modalText">الرسالة...</p>

        <!-- مشغل الصوت المعدل -->
        <audio id="modalAudio" controls style="display: none; width: 100%; margin-top: 10px;">
            متصفحك لا يدعم تشغيل الصوت.
        </audio>

        <button class="modal-btn" onclick="closeGift()">إغلاق ✨</button>
    </div>
</div>

    <script>
        const noTexts = [
            "NO THANKS",
            "Are you sure? 🥺",
            "Really sure?? 💔",
            "Think again! 🌸",
            "Last chance! 😭",
            "Just click YES! ✨"
        ];
        
        let clickCount = 0;
        let yesScale = 1;

        // تكبير زر YES عند الضغط على NO
        function growYes() {
            clickCount++;
            yesScale += 0.45;
            
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            yesBtn.style.transform = `scale(${yesScale})`;

            if (clickCount < noTexts.length) {
                noBtn.innerText = noTexts[clickCount];
            } else {
                noBtn.innerText = noTexts[noTexts.length - 1];
            }
        }

        // الانتقال للصفحة الثانية عند الضغط على YES
        function goToPage2() {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'flex';
        }

      function openGift(title, text, audioPath, flowerImgPath) {

    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalText").textContent = text;
    document.getElementById("modalFlower").src = flowerImgPath;

    const audio = document.getElementById("modalAudio");

    // إيقاف أي أغنية تعمل
    audio.pause();
    audio.currentTime = 0;

    if (audioPath && audioPath.trim() !== "") {

        audio.src = audioPath;
        audio.load(); // مهم جداً
        audio.style.display = "block";

        audio.play().catch(err => {
            console.log("Autoplay blocked:", err);
        });

    } else {
        audio.removeAttribute("src");
        audio.load();
        audio.style.display = "none";
    }

    document.getElementById("giftModal").style.display = "flex";
}

function closeGift() {

    const audio = document.getElementById("modalAudio");

    audio.pause();
    audio.currentTime = 0;
    audio.removeAttribute("src");
    audio.load();

    document.getElementById("giftModal").style.display = "none";
}

    </script>

</body>
</html>
